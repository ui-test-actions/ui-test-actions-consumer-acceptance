name: Verify hosted mobile LAN transport
on:
  workflow_dispatch:
    inputs:
      mode:
        description: IP transport check, live P2pKit pair, or P2pKit network faults
        type: choice
        options: [transport, apps, network]
        default: transport
      picker_android_source:
        description: Exact P2pKit source for the Android native picker regression
        type: string
      picker_recheck:
        description: Reuse the first picker APK and verify reverse readback and reconnect
        type: boolean
        default: false
      android_app_run:
        description: Android sample artifact build run
        type: string
      ios_app_run:
        description: iOS sample artifact build run
        type: string
      android_token_sha256:
        description: SHA-256 of the external Android UI token
        type: string
      ios_token_sha256:
        description: SHA-256 of the external iOS UI token
        type: string
      ios_backend:
        description: Simulator UI driver in app mode
        type: choice
        options: [visible, axe]
        default: visible
permissions:
  contents: read
  actions: read
jobs:
  picker-apk:
    if: inputs.picker_android_source != '' && !inputs.picker_recheck
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require exact Android candidate
        env:
          SOURCE: ${{ inputs.picker_android_source }}
          MODE: ${{ inputs.mode }}
        run: '[[ "$SOURCE" =~ ^[a-f0-9]{40}$ && "$MODE" == network ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: p2pKit/P2pKit
          ref: ${{ inputs.picker_android_source }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build candidate and retain its source and hash
        env:
          SOURCE: ${{ inputs.picker_android_source }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          bash scripts/setup-ci-component.sh android
          ./gradlew :p2p-sample-android:assembleDebug --no-daemon --console=plain
          mkdir "$RUNNER_TEMP/picker-apk"
          cp samples/p2p-sample-android/build/outputs/apk/debug/p2p-sample-android-debug.apk "$RUNNER_TEMP/picker-apk/sample.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/picker-apk/SOURCE_COMMIT"
          (cd "$RUNNER_TEMP/picker-apk" && sha256sum sample.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: picker-apk-${{ github.run_attempt }}
          path: ${{ runner.temp }}/picker-apk/
          if-no-files-found: error
          retention-days: 7
  pair:
    needs: picker-apk
    if: ${{ !cancelled() && (needs.picker-apk.result == 'success' || inputs.picker_android_source == '' || inputs.picker_recheck) }}
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    env:
      LAN_TARGET: ${{ matrix.target }}
      PICKER_RECHECK: ${{ inputs.picker_recheck }}
      LAN_IOS_BACKEND: ${{ inputs.ios_backend }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ui-test-actions/ui-test-actions
          ref: 0c818c5d72e8c30c59bd1287c330a40392bf8e89
          path: published-client
          persist-credentials: false
      - name: Use public client helpers at the action pin
        run: printf 'PYTHONPATH=%s/published-client\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate a job-local LAN identity
        run: bash verification/mobile-lan/trial.sh identity "$LAN_TARGET"
      - name: Start Android-side relay endpoint
        if: matrix.target == 'android'
        run: bash verification/mobile-lan/trial.sh rendezvous "$LAN_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lan-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-lan/public
          if-no-files-found: error
          retention-days: 1
      - name: Set up isolated LAN interface and boot mobile runtime
        env:
          LAN_KEEP: '1'
        run: bash "verification/mobile-lan/preflight-$LAN_TARGET.sh"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.target == 'android' && inputs.picker_android_source != '' && !inputs.picker_recheck
        with:
          name: picker-apk-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-lan-sample
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.target == 'android' && inputs.picker_recheck
        with:
          name: picker-apk-1
          path: ${{ runner.temp }}/mobile-lan-sample
          github-token: ${{ github.token }}
          run-id: 44991524586
      - name: Verify the exact Android candidate APK
        if: matrix.target == 'android' && inputs.picker_android_source != ''
        env:
          SOURCE: ${{ inputs.picker_android_source }}
        run: |
          cd "$RUNNER_TEMP/mobile-lan-sample"
          test "$(cat SOURCE_COMMIT)" = "$SOURCE"
          sha256sum -c SHA256SUMS
          if [[ "$PICKER_RECHECK" == true ]]; then
            test "$(sha256sum sample.apk | cut -d' ' -f1)" = 47a245e584529c639ca5a621aed39a31b7a3adc451618860976c2bdc76ba896d
          fi
          cp SOURCE_COMMIT SHA256SUMS "$RUNNER_TEMP/mobile-lan-preflight/"
          printf 'LAN_DEVICE=emulator-5554\nLAN_APP_ID=dev.p2pkit.sample.android\n' >> "$GITHUB_ENV"
      - name: Fetch and validate the pinned P2pKit sample
        if: inputs.mode != 'transport' && (matrix.target == 'ios' || inputs.picker_android_source == '')
        env:
          GH_TOKEN: ${{ github.token }}
          SAMPLE_RUN: ${{ matrix.target == 'android' && inputs.android_app_run || inputs.ios_app_run }}
          UI_DIGEST: ${{ matrix.target == 'android' && inputs.android_token_sha256 || inputs.ios_token_sha256 }}
        run: bash verification/mobile-lan/prepare-sample.sh "$LAN_TARGET" "$SAMPLE_RUN" "$UI_DIGEST"
      - name: Seed deterministic Android transfer files
        if: matrix.target == 'android' && inputs.mode == 'network'
        run: bash verification/mobile-lan/seed-transfer-files.sh
      - name: Seed the ten picker transfer fixtures
        if: matrix.target == 'android' && inputs.picker_android_source != ''
        run: bash verification/mobile-lan/picker-evidence.sh seed
      - name: Connect the two isolated LAN interfaces
        env:
          GH_TOKEN: ${{ github.token }}
          LAN_FAULTS: ${{ inputs.mode == 'network' && '1' || '0' }}
        run: bash verification/mobile-lan/trial.sh bridge "$LAN_TARGET"
      - name: Verify guest-to-Mac and Mac-to-guest IP delivery
        run: bash verification/mobile-lan/trial.sh verify "$LAN_TARGET"
      - name: Sample actual LAN delivery throughout the fault test
        if: inputs.mode == 'network' && matrix.target == 'android'
        run: bash verification/mobile-lan/trial.sh probe "$LAN_TARGET"
      - name: Expose the live P2pKit app to the same external agent
        if: inputs.mode != 'transport'
        uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89
        with:
          target: ${{ matrix.target }}
          token-sha256: ${{ matrix.target == 'android' && inputs.android_token_sha256 || inputs.ios_token_sha256 }}
          duration-minutes: ${{ inputs.picker_recheck && '12' || inputs.mode == 'network' && '24' || '15' }}
          device: ${{ env.LAN_DEVICE }}
          app-ids: ${{ env.LAN_APP_ID }}
          ios-axe-path: ${{ env.LAN_AXE }}
          network-control-socket: ${{ inputs.mode == 'network' && matrix.target == 'android' && format('{0}/mobile-lan/control/link.sock', runner.temp) || '' }}
          launch: bash verification/mobile-lan/launch-sample.sh "$LAN_TARGET"
      - name: Collect sanitized sample event outcomes
        if: ${{ always() && !cancelled() && inputs.mode != 'transport' && env.LAN_DEVICE != '' }}
        continue-on-error: true
        run: bash verification/mobile-lan/collect-sample.sh "$LAN_TARGET"
      - name: Verify native picker transfers and capture scoped application events
        if: ${{ always() && !cancelled() && inputs.picker_android_source != '' && env.LAN_DEVICE != '' }}
        run: bash verification/mobile-lan/picker-evidence.sh "$LAN_TARGET"
      - name: Retire LAN resources
        if: always()
        run: bash verification/mobile-lan/trial.sh cleanup "$LAN_TARGET"
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lan-transport-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-lan-preflight
          retention-days: 7
