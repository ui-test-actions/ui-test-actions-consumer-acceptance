name: Interactive desktop test
run-name: Consumer · ${{ inputs.target }} · ${{ inputs.purpose }}
on:
  workflow_dispatch:
    inputs:
      purpose:
        type: string
        default: platform
      duration:
        type: string
        default: '12'
      target:
        type: choice
        options: [linux, windows, macos]
        required: true
      token_sha256:
        description: SHA-256 digest of the locally generated session token
        type: string
        required: true
permissions:
  contents: read
jobs:
  interactive:
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","windows":"windows-2025","macos":"macos-15"}')[inputs.target] }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the retained Windows POS package in training mode
        if: inputs.target == 'windows' && inputs.purpose == 'v301-pos-training'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/prepare-pos-windows.ps1
      - name: Build the test app
        if: inputs.purpose != 'v301-pos-training'
        shell: bash
        run: bash ci/build-desktop-app.sh # Replace with your build command.
      - uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89
        env:
          CONSUMER_SCENARIO: ${{ inputs.purpose }}
          UI_FIXTURE_EVENTS: ${{ runner.temp }}/fixture-events.jsonl
        with:
          target: ${{ inputs.target }}
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: ${{ inputs.duration }}
          transport-fallback: ${{ inputs.purpose == 'v301-connector-exit' && 'local' || 'none' }}
          launch: ${{ inputs.purpose == 'v301-pos-training' && 'powershell -NoProfile -File ci/launch-pos-windows.ps1' || 'bash ci/launch-desktop-app.sh' }}
          ready: ${{ inputs.purpose == 'v301-pos-training' && 'powershell -NoProfile -File ci/check-pos-windows.ps1' || 'bash ci/check-desktop-ready.sh' }}
          desktop-apps: >-
            {"crash-fixture":{"argv":["${{ inputs.target == 'linux' && '/usr/bin/python3' || 'python' }}","fixtures/desktop.py","crash-fixture-ready","18"]},"freeze-fixture":{"argv":["${{ inputs.target == 'linux' && '/usr/bin/python3' || 'python' }}","fixtures/desktop.py","freeze-fixture-ready","freeze-once"]}}
          diagnostic-logs: '{"fixture":{"path":"fixture-events.jsonl","events":["process.frozen"]}}'
