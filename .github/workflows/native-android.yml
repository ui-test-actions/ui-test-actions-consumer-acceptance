name: Verify native Android Appium integration
on:
  workflow_dispatch:
    inputs:
      token_sha256:
        description: SHA-256 digest of the agent's private token
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ui-test-actions/ui-test-actions
          ref: 0c818c5d72e8c30c59bd1287c330a40392bf8e89
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare packaged SDK emulator and start Appium
        shell: bash
        run: |
          source fixtures/android/emulator.sh
          boot_fixture_emulator native-tests emulator.log
          bash fixtures/android/build.sh build/android
          adb -s emulator-5554 install -r build/android/fixture.apk
          export APPIUM_HOME="$RUNNER_TEMP/appium-home"
          npm install --prefix "$RUNNER_TEMP/appium" --no-audit --no-fund appium@3.9.1
          appium="$RUNNER_TEMP/appium/node_modules/.bin/appium"
          "$appium" driver install --source=npm appium-uiautomator2-driver@8.7.3
          "$appium" --address 127.0.0.1 --port 4723 --log-level warn > appium.log 2>&1 &
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:4723/status
      - uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89
        with:
          target: android
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '8'
          device: emulator-5554
          app-ids: dev.uitest.fixture
          deeplink-schemes: ui-test-fixture
          webdriver-url: http://127.0.0.1:4723
          webdriver-capabilities: >-
            {"platformName":"Android","appium:automationName":"UiAutomator2","appium:appPackage":"dev.uitest.fixture","appium:appActivity":".MainActivity"}
      - name: Retain backend diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-appium-diagnostics
          path: |
            appium.log
            emulator.log
          retention-days: 3
