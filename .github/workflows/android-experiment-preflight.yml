name: Android experiment · runner preflight

# Read-only host/SDK inspection. Every other phase is gated on this evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Record runner, SDK, and acceleration facts
        shell: bash
        run: bash ci/experiment/preflight.sh evidence/runner
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: android-experiment-preflight-${{ github.run_id }}
          path: evidence/runner
          if-no-files-found: error
          retention-days: 14
      - name: Summarize preflight
        if: always()
        shell: bash
        run: |
          {
            echo "### Android experiment runner preflight"
            echo '```'
            cat evidence/runner/configuration.txt
            echo '```'
            echo '```'
            cat evidence/runner/acceleration.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
