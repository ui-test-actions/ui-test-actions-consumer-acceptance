name: Android experiment · isolated rootAVD and Magisk

# Phase C: disposable AOSP image, pinned rootAVD, pinned official Magisk.
# The guest is isolated from outbound IP traffic before the patch is applied.
#
# Push-triggered for the same reason as the other experiment workflows.
on:
  push:
    branches: [experiment/integrity-root-magisk]
    paths: [experiment/triggers/root]

permissions:
  contents: read

jobs:
  root-magisk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UI_TEST_ACTION_REF: 0c818c5d72e8c30c59bd1287c330a40392bf8e89
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ui-test-actions/ui-test-actions
          ref: ${{ env.UI_TEST_ACTION_REF }}
          path: published-client
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Stage dependencies and boot the disposable AOSP emulator
        shell: bash
        run: bash ci/experiment/root-magisk.sh setup
      - name: Build the UI fixture APK
        shell: bash
        run: |
          bash published-client/fixtures/android/build.sh "$RUNNER_TEMP/integrity-fixture"
          echo "FIXTURE_APK=$RUNNER_TEMP/integrity-fixture/fixture.apk" >> "$GITHUB_ENV"
      - name: Isolate the guest and apply the reviewed rootAVD patch
        shell: bash
        run: bash ci/experiment/root-magisk.sh patch
      - name: Cold boot and verify Magisk root
        shell: bash
        run: bash ci/experiment/root-magisk.sh verify
      - name: Start bounded su attempts for the interactive grant
        shell: bash
        run: |
          nohup bash ci/experiment/su-loop.sh evidence/root > evidence/root/su-loop.out 2>&1 &
          echo "su_loop_pid=$!"
      - name: Generate the one-time session token on the runner
        id: token
        shell: bash
        run: |
          umask 077
          token_file="$RUNNER_TEMP/session-token"
          openssl rand -hex 32 > "$token_file"
          token="$(cat "$token_file")"
          echo "::add-mask::$token"
          sha="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
          printf 'sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'file=%s\n' "$token_file" >> "$GITHUB_OUTPUT"
      - name: Upload the private session token for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: ui-session-token-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.token.outputs.file }}
          if-no-files-found: error
          retention-days: 1
      - name: Open the authenticated UI session on the rooted emulator
        id: session
        uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89 # v3.0.1 action pin
        with:
          target: android
          device: emulator-5554
          token-sha256: ${{ steps.token.outputs.sha256 }}
          duration-minutes: '8'
          startup-timeout-seconds: '180'
          app-ids: com.topjohnwu.magisk,com.android.settings,dev.uitest.fixture
          app-installs: '{"dev.uitest.fixture":"${{ env.FIXTURE_APK }}"}'
          launch: |
            adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
            adb -s emulator-5554 shell wm dismiss-keyguard
            adb -s emulator-5554 shell input keyevent KEYCODE_HOME
            adb -s emulator-5554 shell am start -W -n com.topjohnwu.magisk/.ui.MainActivity >/dev/null 2>&1 || true
          ready: |
            adb -s emulator-5554 shell getprop sys.boot_completed | grep -q 1
      - name: Ensure the shell su policy if the interactive grant did not complete
        if: always()
        shell: bash
        run: bash ci/experiment/root-magisk.sh grant
      - name: Install and inspect the inert module
        if: always()
        shell: bash
        run: bash ci/experiment/root-magisk.sh module
      - name: Second cold boot, root persistence, and module marker
        if: always()
        shell: bash
        run: bash ci/experiment/root-magisk.sh reboot
      - name: Collect root evidence
        if: always()
        timeout-minutes: 5
        shell: bash
        run: bash ci/experiment/root-magisk.sh collect
      - name: Upload root and Magisk evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: android-experiment-root-${{ github.run_id }}
          path: evidence/root
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize root results
        if: always()
        shell: bash
        run: |
          {
            echo "### Isolated rootAVD and Magisk"
            echo "Session outcome: ${{ steps.session.outcome }}"
            echo '```'
            cat evidence/root/root-verification.txt 2>/dev/null || true
            echo '---'
            cat evidence/root/reboot-verification.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
