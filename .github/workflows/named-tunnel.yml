name: Independent consumer Named Tunnel acceptance
on:
  workflow_dispatch:
    inputs:
      hostname:
        type: string
        description: Dedicated Cloudflare-routed hostname for this verification
        required: true
      token_sha256:
        type: string
        description: SHA-256 digest of the test session bearer
        required: true
      access:
        description: Verify an Access Service Auth policy with the configured test credential pair
        type: boolean
        default: true
      duration:
        type: string
        description: Minutes after the app is ready
        default: '8'
permissions:
  contents: read
concurrency:
  group: named-ui-tunnel-${{ inputs.hostname }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check account-specific configuration
        shell: bash
        env:
          CONNECTOR_CONFIGURED: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN != '' }}
          ACCESS_REQUIRED: ${{ inputs.access }}
          ACCESS_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID != '' && secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET != '' }}
        run: |
          if [[ "$CONNECTOR_CONFIGURED" != true ]]; then
            printf '%s\n' 'Set the connector secret for the dedicated Named Tunnel.' >&2
            exit 1
          fi
          if [[ "$ACCESS_REQUIRED" == true && "$ACCESS_CONFIGURED" != true ]]; then
            printf '%s\n' 'Configure both Access service-token secrets for the dedicated test policy.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ui-test-actions/ui-test-actions
          ref: 672f07488d17d39375d8895398d72e4fb94b4437
          path: published-client
          persist-credentials: false
      - name: Use public client helpers at the action pin
        run: printf 'PYTHONPATH=%s/published-client\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Prepare a dedicated visual test application
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
            python3-tk fonts-noto-core xvfb xauth xdotool xclip openbox wmctrl \
            python3-pyatspi at-spi2-core dbus-x11
          mkdir -m 700 "$RUNNER_TEMP/named-transport-proof"
      - uses: ui-test-actions/ui-test-actions@672f07488d17d39375d8895398d72e4fb94b4437
        with:
          target: linux
          token-sha256: ${{ inputs.token_sha256 }}
          transport: cloudflare-named
          access-client-id: ${{ inputs.access && secrets.CLOUDFLARE_ACCESS_CLIENT_ID || '' }}
          access-client-secret: ${{ inputs.access && secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET || '' }}
          tunnel-hostname: ${{ inputs.hostname }}
          tunnel-token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          origin-port: '8787'
          duration-minutes: ${{ inputs.duration }}
          file-exchange: '1'
          launch: /usr/bin/python3 verification/transports/fixture.py "$RUNNER_TEMP/named-transport-proof" > "$RUNNER_TEMP/named-transport-proof/app.log" 2>&1 &
          ready: test -f "$UI_TEST_EXCHANGE_DIR/controls.json"
      - name: Confirm one delivery to the native app
        run: |
          PYTHONPATH="verification:$PYTHONPATH" python - <<'PY'
          import json, os
          from pathlib import Path
          from probe_fixture import TEST_TEXT

          path = Path(os.environ["RUNNER_TEMP"]) / "named-transport-proof/app-state.json"
          assert json.loads(path.read_text()) == [TEST_TEXT]
          print("The app submitted the exact Unicode test text once.")
          PY
