name: Android experiment · stock Google Play baseline

# Phase A/B: clean official Google Play image, genuine Play Store integrity
# diagnostic attempted through a real UI Test Actions session.
#
# Dispatch is replaced by a push to experiment/triggers/stock because
# workflow_dispatch requires the workflow to exist on the default branch, and
# this experiment must not modify the production branch.
on:
  push:
    branches: [experiment/integrity-root-magisk]
    paths: [experiment/triggers/stock]

permissions:
  contents: read

jobs:
  stock-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      UI_TEST_ACTION_REF: 0c818c5d72e8c30c59bd1287c330a40392bf8e89
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ui-test-actions/ui-test-actions
          ref: ${{ env.UI_TEST_ACTION_REF }}
          path: published-client
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Boot the stock Google Play emulator and record the baseline
        shell: bash
        run: bash ci/experiment/stock-baseline.sh boot
      - name: Build the UI fixture APK
        shell: bash
        run: bash published-client/fixtures/android/build.sh "$RUNNER_TEMP/integrity-fixture"
      - name: Generate the one-time session token on the runner
        id: token
        shell: bash
        run: |
          umask 077
          token_file="$RUNNER_TEMP/session-token"
          openssl rand -hex 32 > "$token_file"
          token="$(cat "$token_file")"
          echo "::add-mask::$token"
          sha="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
          printf 'sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'file=%s\n' "$token_file" >> "$GITHUB_OUTPUT"
      - name: Upload the private session token for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: ui-session-token-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.token.outputs.file }}
          if-no-files-found: error
          retention-days: 1
      - name: Open the authenticated UI session
        id: session
        uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89 # v3.0.1 action pin
        with:
          target: android
          device: emulator-5554
          token-sha256: ${{ steps.token.outputs.sha256 }}
          duration-minutes: '20'
          startup-timeout-seconds: '180'
          app-ids: >-
            com.android.vending,com.android.settings,com.google.android.gms,com.google.android.apps.nexuslauncher,com.android.launcher3,dev.uitest.fixture
          app-installs: '{"dev.uitest.fixture":"${{ env.FIXTURE_APK }}"}'
          launch: |
            adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
            adb -s emulator-5554 shell wm dismiss-keyguard
            adb -s emulator-5554 shell input keyevent KEYCODE_HOME
          ready: |
            adb -s emulator-5554 shell getprop sys.boot_completed | grep -q 1
      - name: Collect post-session evidence
        if: always()
        shell: bash
        run: bash ci/experiment/stock-baseline.sh collect
      - name: Upload stock baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: android-experiment-stock-${{ github.run_id }}
          path: evidence/stock
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize the stock baseline
        if: always()
        shell: bash
        run: |
          {
            echo "### Stock Google Play baseline"
            echo "Session outcome: ${{ steps.session.outcome }}"
            echo '```'
            sed -n '1,120p' evidence/stock/configuration.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
