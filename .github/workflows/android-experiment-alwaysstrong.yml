name: Android experiment · AlwaysStrong source assessment

# Phase D: static assessment only. The module is never installed or executed,
# and the live Play Integrity verifier is never contacted.
on:
  push:
    branches: [experiment/integrity-root-magisk]
    paths: [experiment/triggers/alwaysstrong]

permissions:
  contents: read

jobs:
  alwaysstrong-assessment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Record reviewed commit, release hashes, ABI matrix, and claims
        shell: bash
        run: bash ci/experiment/alwaysstrong-assessment.sh
      - name: Upload AlwaysStrong assessment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: android-experiment-alwaysstrong-${{ github.run_id }}
          path: evidence/alwaysstrong
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize the assessment
        if: always()
        shell: bash
        run: |
          {
            echo "### AlwaysStrong source assessment"
            echo '```'
            cat evidence/alwaysstrong/version.txt 2>/dev/null || true
            echo '---'
            cat evidence/alwaysstrong/independent-evidence-status.md 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
